            padding: 0.75rem;
            border-radius: 6px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            font-size: 0.9rem;
            transition: border-color var(--transition-fast, 0.2s);

        .custom-textarea:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(255, 255, 255, 0.08);
        }
        .radio-group-horizontal {
            display: flex;
            gap: 2rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .radio-group-horizontal label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-main);
        }
        .radio-group-horizontal input[type="radio"] {
            transform: scale(1.2);
            cursor: pointer;
        }
        .checkbox-group-horizontal {
            display: flex;
            gap: 1.25rem;
            align-items: center;
            flex-wrap: wrap;

        .checkbox-group-horizontal label {

            gap: 0.5rem;

            font-size: 0.9rem;
            color: var(--text-main);

        .checkbox-group-horizontal input[type="checkbox"] {

        div[id$="checkboxes"] label {

            align-items: center;
            gap: 0.35rem;
